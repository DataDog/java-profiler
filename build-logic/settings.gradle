pluginManagement {
    def mavenRepositoryProxy = providers.gradleProperty('mavenRepositoryProxy')
        .orElse(providers.environmentVariable('MAVEN_REPOSITORY_PROXY'))
        .orNull?.trim()
    def gradlePluginProxy = providers.gradleProperty('gradlePluginProxy')
        .orElse(providers.environmentVariable('GRADLE_PLUGIN_PROXY'))
        .orNull?.trim()
    repositories {
        if (mavenRepositoryProxy) {
            maven { url = uri(mavenRepositoryProxy) }
        }
        if (gradlePluginProxy && gradlePluginProxy != mavenRepositoryProxy) {
            maven { url = uri(gradlePluginProxy) }
        }
        if (!mavenRepositoryProxy && !gradlePluginProxy) {
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

rootProject.name = 'build-logic'

include 'conventions'
