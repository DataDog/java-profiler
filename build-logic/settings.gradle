pluginManagement {
    def gitlabCi = providers.environmentVariable('GITLAB_CI').orNull == 'true'
    def mavenRepositoryProxy = gitlabCi
        ? providers.gradleProperty('mavenRepositoryProxy')
            .orElse(providers.environmentVariable('MAVEN_REPOSITORY_PROXY')).orNull?.trim() ?: null
        : providers.gradleProperty('mavenRepositoryProxy').orNull
    def gradlePluginProxy = gitlabCi
        ? providers.gradleProperty('gradlePluginProxy')
            .orElse(providers.environmentVariable('GRADLE_PLUGIN_PROXY')).orNull?.trim() ?: null
        : null
    repositories {
        if (mavenRepositoryProxy != null) {
            maven { url = uri(mavenRepositoryProxy) }
        }
        if (gradlePluginProxy && gradlePluginProxy != mavenRepositoryProxy) {
            maven { url = uri(gradlePluginProxy) }
        }
        if (gitlabCi && (mavenRepositoryProxy || gradlePluginProxy)) {
            // The generic Depot mirror rejects HEAD requests used for Gradle cache revalidation.
            exclusiveContent {
                forRepository { gradlePluginPortal() }
                filter {
                    includeGroup('org.gradle.kotlin.kotlin-dsl')
                    includeGroup('org.gradle.kotlin')
                }
            }
        }
        if (!gitlabCi || (!mavenRepositoryProxy && !gradlePluginProxy)) {
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

rootProject.name = 'build-logic'

include 'conventions'
