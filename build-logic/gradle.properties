# Compile build-logic inside the Gradle process instead of a separate Kotlin
# daemon. The daemon outlives the compile (it idles for 2h) and stays resident
# for the rest of the build -- through the whole test run -- next to the Gradle
# process and the test JVMs; measured on this build it costs ~660MB RSS against
# ~340MB of extra Gradle RSS for in-process. That matters on memory-limited CI
# runners. build-logic rarely changes, so a warm daemon buys little locally.
kotlin.compiler.execution.strategy=in-process
