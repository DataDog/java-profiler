variables:
  FUZZ_IMAGE: registry.ddbuild.io/java-profiler-fuzz
  FUZZYDOG_VERSION: "0.28.0"

# Compile-gate the libFuzzer targets and soak the chaos suites.
#
# fuzz_infra below only runs on scheduled/manual pipelines and is
# allow_failure, so a fuzz target that stops compiling can survive an entire
# PR unnoticed - PR 797 broke fuzz_callTraceStorage exactly this way, caught
# only by a manual buildFuzz run. This job runs on every branch push like the
# sanitizer jobs: build the fuzz targets (asserting they were actually
# produced - hasFuzzer()'s probe failing would otherwise silently no-op the
# gate), then soak the concurrency-dependent chaos suites under TSan with
# --gtest_repeat/--gtest_shuffle, which is the only way race code gets
# statistical confidence from a single CI run.
fuzz-build-and-soak:
  stage: sanitizer
  extends: .cache-config
  needs: []
  timeout: 45m
  interruptible: true
  # TSan on amd64 requires a non-Kata runner - same constraint as the TSan
  # sanitizer job (Kata maps host-guest communication structures into TSan's
  # shadow region regardless of LLVM version or sysctl).
  tags: [ "docker-in-docker:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    GRADLE_USER_HOME: .gradle
  rules:
    - if: '$JDK_VERSION != null || $DEBUG_LEVEL != null || $HASH != null || $DOWNSTREAM != null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  script:
    - ./gradlew :ddprof-lib:fuzz:buildFuzz --no-daemon --parallel --build-cache
    - |
      if ! find ddprof-lib/fuzz/build/bin/fuzz -maxdepth 2 -type f -executable | grep -q .; then
        echo "No fuzz binaries produced - the libFuzzer availability probe must have failed; failing the compile gate"
        exit 1
      fi
    - ./gradlew :ddprof-lib:buildGtestTsan --no-daemon --parallel --build-cache
    - GTEST_DEATH_TEST_STYLE=threadsafe ./ddprof-lib/build/bin/gtest/tsan_referenceChains_ut/referenceChains_ut --gtest_repeat=50 --gtest_shuffle --gtest_filter='ReferenceChainsLifecycleTest.*:RcDebugLevelTest.ReadFileConcurrentSwapChaos:FrontierTableTest.*:OomUrgencyTest.*:ReferenceChainsCanaryRefillTest.*:ReferenceChainsBfsTest.CanaryStuckLimitDoublesPerRestartAndResetsOnCleanCompletion:PollWatchedTargetsTest.RestartDropsPriorRecordingsChainsAndAbandonedEvents'
    - GTEST_DEATH_TEST_STYLE=threadsafe ./ddprof-lib/build/bin/gtest/tsan_livenessTracker_ut/livenessTracker_ut --gtest_repeat=50 --gtest_shuffle --gtest_filter='LeakTagPoolTest.*:AdmissionBoostTest.*'

fuzz_infra:
  needs: []
  extends: .retry-config
  image: registry.ddbuild.io/images/docker:27.3.1
  tags: ["arch:amd64"]
  stage: fuzz
  timeout: 1h30m
  allow_failure: true
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_FUZZ == "true"'
    - when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip jq
    - >-
      curl -fsSL "https://binaries.ddbuild.io/fuzzing/fuzzydog/${FUZZYDOG_VERSION}/fuzzydog-tar.tar.gz"
      | tar -xz -C /usr/local/bin fuzzydog-linux-amd64 &&
      mv /usr/local/bin/fuzzydog-linux-amd64 /usr/local/bin/fuzzydog
    - >-
      curl -fsSL "https://releases.hashicorp.com/vault/1.21.1/vault_1.21.1_linux_amd64.zip"
      -o /tmp/vault.zip &&
      unzip -o /tmp/vault.zip -d /usr/local/bin vault &&
      rm /tmp/vault.zip
  script:
    - .gitlab/scripts/fuzz_infra.sh
