stages:
  - images
variables:
  # Base images for the build docker images
  # Both pinned by digest for reproducibility. JDK 21 is installed at
  # image-build time via SDKMAN (see .gitlab/base/Dockerfile).
  #
  # Debian 13 trixie (glibc 2.41), current stable. These images run the test,
  # sanitizer, integration and packaging jobs; the shipped binaries are
  # compiled in the AlmaLinux 8 image below, so this glibc is not a customer
  # floor and the release can track stable.
  OPENJDK_BASE_IMAGE: debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
  OPENJDK_BASE_IMAGE_ARM64: debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
  # eclipse-temurin:21-jdk-alpine = Alpine 3.x musl; arm64 manifest confirmed present.
  OPENJDK_BASE_IMAGE_MUSL: eclipse-temurin:21-jdk-alpine@sha256:c98f0d2e171c898bf896dc4166815d28a56d428e218190a1f35cdc7d82efd61f
  OPENJDK_BASE_IMAGE_ARM64_MUSL: eclipse-temurin:21-jdk-alpine@sha256:c98f0d2e171c898bf896dc4166815d28a56d428e218190a1f35cdc7d82efd61f
  # AlmaLinux 8 (glibc 2.28) with gcc-toolset-14 compiles the shipped glibc
  # binaries on both architectures. Release builds link -static-libstdc++
  # -static-libgcc, so this toolchain's C++ runtime ships inside the library
  # and must be one that still gets security rebuilds. The resulting .so
  # requires GLIBC_2.27. Multi-arch manifest, pinned by digest.
  BASE_IMAGE_GLIBC: almalinux:8@sha256:9f355ae942d6a6c0561f0771dc053a2cfae9580fc45fa4252756db7c7e80c09f
  # Oracle Linux 7 (glibc 2.17) — best-maintained EL7 derivative (live CDN,
  # both arches, working collections). Runtime-only: runs the x64 stresstest
  # and functional suites against the AlmaLinux-8-built shipped binary, so
  # that coverage at the actual glibc floor doesn't go to zero (PR #790).
  # Multi-arch manifest, pinned by digest.
  BASE_IMAGE_EL7: oraclelinux:7@sha256:767c93c07b1fa621ae56d1f5f090e8c0dce7eb452e7dda1e74bbe7546504d63f

  DOCKER_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/images/docker:24.0.4-gbi-focal
