    - job: build:arm64
      artifacts: true
  tags: [ "arch:arm64" ]
  variables:
    # same image as build:arm64, so the stress run exercises the shipped build
    RUNTIME_IMAGE: ${BUILD_IMAGE_ARM64_GLIBC}
    TARGET: linux-arm64

