.build_job:
  extends:
    - .retry-config
    - .cache-config
  stage: build
  needs:
    - job: prepare:start
      artifacts: true
  when: on_success
  tags: [ "arch:amd64" ]
  image: ${BUILD_IMAGE}
  script:
    - .gitlab/scripts/build.sh
  artifacts:
    when: always
    paths:
      - libs/$TARGET/libjavaProfiler.so
      - libs/$TARGET/libjavaProfiler.so.debug
      - test/$TARGET/reports
      - test/$TARGET/logs
      - "**/output.txt"
      - "**/options.txt"
      - "ddprof-test/${TARGET}/reports/tests/test/**/*"
    expire_in: 1 day

.stresstest_job:
  extends:
    - .retry-config
    - .cache-config-pull
  stage: stresstest
  needs:
    - job: prepare:start
      artifacts: true
  when: on_success
  tags: [ "arch:amd64" ]
  # RUNTIME_IMAGE decouples the runtime environment from the image the
  # artifact was built in (BUILD_IMAGE): stresstest:x64 runs on Oracle Linux 7
  # to exercise the shipped binary's actual glibc floor, while consuming the
  # same artifact build:x64 produced in the AlmaLinux 8 image. Other stresstest
  # jobs set RUNTIME_IMAGE to their own BUILD_IMAGE, unchanged from before.
  image: ${RUNTIME_IMAGE}
  script:
    - .gitlab/scripts/stresstests.sh
  artifacts:
    when: always
    paths:
      - stresstest/$TARGET/logs
      - stresstest/$TARGET/results
    expire_in: 2 weeks

prepare:start:
  extends: .retry-config
  stage: prepare
  rules:
    - if: '$DOWNSTREAM != null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: always
  interruptible: true
  tags: [ "arch:arm64" ]
  image: ${PREPARE_IMAGE}

  script:
    - .gitlab/scripts/prepare.sh

  artifacts:
    paths:
      - version.txt
    reports:
      dotenv: build.env
    expire_in: 1 day

build:x64:
