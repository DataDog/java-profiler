  tags: [ "arch:arm64" ]
  variables:
    RUNTIME_IMAGE: ${BUILD_IMAGE_ARM64_MUSL}
    TARGET: linux-arm64-musl

# Runs the functional (ddprof-test) suite on Oracle Linux 7 against the
# shipped x64 artifact, so the libc-sensitive suites get real coverage at the
# glibc 2.17 floor (see PR #790's follow-up). Schedule-only by default: a
# 2-3 JDK subset is enough to catch a libc regression, and Temurin 8/17/21
# all start on glibc 2.17. jdk8 additionally runs on every PR (below), so
# EL7 functional coverage isn't gated on the nightly schedule entirely.
.functional_job:
  extends:
    - .retry-config
    - .cache-config-pull
  stage: stresstest
  needs:
    - job: prepare:start
      artifacts: true
    - job: build:x64
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never
  tags: [ "arch:amd64" ]
  image: ${BUILD_IMAGE_X64_EL7}
  variables:
    TARGET: linux-x64
  script:
    - .gitlab/scripts/functional-tests.sh
  artifacts:
    when: always
    paths:
      - functional/$TARGET/jdk$TEST_JDK/reports
      - functional/$TARGET/jdk$TEST_JDK/logs
    expire_in: 2 weeks

# Runs on every pipeline (not just nightly): JDK 8 is the oldest/most
# different from the JDK 21 that runs Gradle, giving the most distinct
# per-PR signal for a libc regression at low added cost.
functional:x64-el7-jdk8:
  extends: .functional_job
  rules:
    - when: on_success
  variables:
    TEST_JDK: "8"

functional:x64-el7-jdk17:
  extends: .functional_job
  variables:
    TEST_JDK: "17"

functional:x64-el7-jdk21:
  extends: .functional_job
  variables:
    TEST_JDK: "21"

# --- TEMPORARY diagnostic jobs -------------------------------------------
# Investigating why NativeSocket* tests produce zero events on the EL7
# runtime (functional:x64-el7-jdk8 keeps failing there). Builds a real DEBUG
# config (which compiles in NativeSocketSampler's _send_hook_calls/
# _recv_hook_calls atomics and TEST_LOG calls, gated #ifdef DEBUG) on the
# AlmaLinux 8 toolchain build:x64 already uses, then runs just the
# NativeSocket* suite against it on the EL7 runtime, so the --info log
# shows whether the hooks ever fire at all. Remove both jobs once this is
# root-caused.
build:x64-debug-diag:
  extends: .build_job
  variables:
    BUILD_IMAGE: ${BUILD_IMAGE_X64_GLIBC}
    # Matches NativeBuildExtension.platformIdentifier(), which is the actual
    # subdirectory name under build/native/debug/META-INF/native-libs/ --
    # NOT a free-form label. build.sh's TARGET for build:x64 relies on the
    # same match; a different TARGET here would nest the .so one directory
    # too deep for the artifacts:paths pattern below to find it.
    TARGET: linux-x64
  script:
    - |
      if [ -z "${JAVA_HOME}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
        export JAVA_HOME=~/.sdkman/candidates/java/current
      fi
      source .gitlab/scripts/includes.sh
      # -Dddprof.debugStaticLibstdcxx=true: diagnostic-only (ConfigurationPresets.kt),
      # statically links libstdc++/libgcc into the debug .so the same way release
      # already does. Without it, the debug .so needs a GLIBCXX newer than EL7's
      # stock gcc 4.8.5 provides -- confirmed by the UnsatisfiedLinkError this
      # diagnostic build previously hit ("GLIBCXX_3.4.20 not found").
      ./gradlew -Pddprof_version="$(get_version)" -Pskip-cpp-tests -Dddprof.debugStaticLibstdcxx=true \
        :ddprof-lib:assembleDebugJar --no-build-cache --stacktrace --info --no-watch-fs --no-daemon
      mkdir -p libs
      cp -r ddprof-lib/build/native/debug/META-INF/native-libs/* libs/

functional:x64-el7-debug-diag:
  extends: .functional_job
  needs:
    - job: prepare:start
      artifacts: true
    - job: build:x64-debug-diag
      artifacts: true
  rules:
    - when: on_success
  variables:
    TARGET: linux-x64
    TEST_JDK: "8"
    TEST_CONFIG: "Debug"
    TESTS_FILTER: "*NativeSocket*"
# --- end TEMPORARY diagnostic jobs ---------------------------------------

# Builds the chaos reliability harness once per pipeline so the per-cell
# reliability jobs can pull it as an artifact instead of compiling inline.
# Schedule-only because reliability cells are schedule-only.
chaos:build:
  extends:
    - .retry-config
    - .cache-config-pull
  stage: stresstest
  needs:
    - job: prepare:start
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never
  tags: [ "arch:amd64" ]
  image: ${BUILD_IMAGE_X64_GLIBC}
  script:
    - |
      if [ -z "${JAVA_HOME}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
        export JAVA_HOME=~/.sdkman/candidates/java/current
      fi
    - ./gradlew :ddprof-stresstest:chaosJar -q
  artifacts:
    paths:
      - ddprof-stresstest/build/libs/chaos.jar
    expire_in: 1 day

build-artifact:
  extends: .cache-config-pull
  stage: deploy
  needs:
    - job: prepare:start
      artifacts: true
    - job: build:x64
      artifacts: true
    - job: build:x64-musl
      artifacts: true
    - job: build:arm64
      artifacts: true
    - job: build:arm64-musl
      artifacts: true
    - job: gtest-asan-amd64
      artifacts: false
    - job: gtest-tsan-amd64
      artifacts: false
      optional: true
    - job: gtest-asan-arm64
      artifacts: false
    - job: gtest-tsan-arm64
      artifacts: false
      optional: true
  rules:
    - !reference [.skip-on-release, rules]
    - when: on_success
  tags: [ "arch:amd64" ]
  image: ${BUILD_IMAGE_X64}

  script:
    - .gitlab/scripts/deploy.sh assemble

  artifacts:
    name: java-profiler.zip
    paths:
      - ddprof-lib/build/libs/ddprof-*.jar
      - ddprof-lib/build/classes/java/main/META-INF/native-libs/*
      - version.txt
    expire_in: 28 days

deploy-artifact:
  extends:
    - .cache-config-pull
    - .deploy-sa
  stage: deploy
  needs:
    - job: prepare:start
      artifacts: true
    - job: build-artifact
      artifacts: true
    - job: build:x64
      artifacts: true
    - job: build:x64-musl
      artifacts: true
    - job: build:arm64
      artifacts: true
    - job: build:arm64-musl
      artifacts: true
  rules:
