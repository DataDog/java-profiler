    TARGET: linux-arm64-musl

stresstest:x64:
  extends: .stresstest_job
  needs:
    - job: prepare:start
      artifacts: true
    - job: build:x64
      artifacts: true
  variables:
    # Oracle Linux 7 (glibc 2.17) — the artifact's actual floor, restoring the
    # runtime coverage build:x64 lost when it moved to AlmaLinux 8 (PR #790).
    RUNTIME_IMAGE: ${BUILD_IMAGE_X64_EL7}
    TARGET: linux-x64

stresstest:x64-musl:
