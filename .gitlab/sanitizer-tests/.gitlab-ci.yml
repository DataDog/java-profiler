# C++ unit tests under ASan, TSan, and release optimisation.
#
# These run on every branch push (not MR pipelines — GitHub Actions handles those).
#
# The release configuration is here rather than left to the label-gated Java
# matrix because it is the only one that compiles the gtests with optimisation.
# Both sanitizer presets pass -fno-optimize-sibling-calls and no -O, so any
# defect that only appears once the optimiser runs -- a fixture frame folded
# away by a tail call, say -- is invisible to every other job in the pipeline.
#
# Strategy: use Gradle only for compile+link (buildGtest{Config}), then run
# each binary directly from the shell. This bypasses Gradle's daemon I/O
# which swallows child process output when fd 1/2 are not the terminal.
#
# Every binary run goes through the flake/quarantine machinery shared with the
# Java cells (.gitlab/scripts/run-gtest-quarantine.sh ->
# .github/scripts/run_tests_with_retry.sh): gtest JUnit XML per binary, two
# attempts, and a failing test only excuses the job when it is on
# ddprof-test/quarantine.txt for this cell (glibc-<config>-<arch>).

.sanitizer_job:
  stage: sanitizer
  extends: .cache-config
  needs: []
  # The retry adds a second full pass. The build runs once, so the new worst
  # case (build + two passes) stays inside twice the old 30m budget -- which
  # itself had headroom over a single pass. Revisit against real cell
  # durations if a timeout kill ever masks the quarantine classification.
  timeout: 60m
  variables:
    GRADLE_USER_HOME: .gradle
  rules:
    - if: '$JDK_VERSION != null || $DEBUG_LEVEL != null || $HASH != null || $DOWNSTREAM != null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  interruptible: true
  # No before_script override: the toolchain lives in the build image, so the
  # pipeline default (CANCELLED guard, maven proxy) applies here like anywhere
  # else.
  script:
    - ./gradlew :ddprof-lib:buildGtest${SANITIZER_CONFIG} --no-daemon --parallel --build-cache
    - .gitlab/scripts/run-gtest-quarantine.sh
  artifacts:
    when: always
    paths:
      - ddprof-lib/build/bin/gtest/${SANITIZER_LC}*/
      # gtest JUnit XML -- the flake evidence the quarantine decision reads.
      - ddprof-lib/build/test-results/gtest/
    expire_in: 1 day

gtest-asan-amd64:
  extends: .sanitizer_job
  tags: [ "arch:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Asan
    SANITIZER_LC: asan
    GTEST_ARCH: amd64

gtest-tsan-amd64:
  extends: .sanitizer_job
  # docker-in-docker:amd64 = Kata Containers (kata-qemu micro VMs).
  # Kata maps host-guest communication structures at fixed high addresses
  # that land in TSan's shadow region regardless of LLVM version or sysctl.
  # TSan on amd64 requires a non-Kata runner (EC2 or bare metal).
  tags: [ "docker-in-docker:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Tsan
    SANITIZER_LC: tsan
    GTEST_ARCH: amd64
    # Death tests fork; under TSan the child re-runs the interceptor init,
    # so the default "fast" style deadlocks. Inherited by every binary the
    # runner script executes.
    GTEST_DEATH_TEST_STYLE: threadsafe

gtest-asan-arm64:
  extends: .sanitizer_job
  tags: [ "arch:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Asan
    SANITIZER_LC: asan
    GTEST_ARCH: aarch64

# Not a sanitizer, but it reuses .sanitizer_job unchanged: buildGtestRelease
# exists alongside the sanitizer variants and emits binaries under the same
# bin/gtest/<config>_<test>/ layout the runner loop already globs for. The
# SANITIZER_* variable names are a misnomer here and nothing more.
gtest-release-amd64:
  extends: .sanitizer_job
  tags: [ "arch:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Release
    SANITIZER_LC: release
    GTEST_ARCH: amd64

gtest-release-arm64:
  extends: .sanitizer_job
  tags: [ "arch:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Release
    SANITIZER_LC: release
    GTEST_ARCH: aarch64

gtest-tsan-arm64:
  extends: .sanitizer_job
  # docker-in-docker:arm64 = EC2 VM. sysctl works directly.
  # vm.mmap_rnd_bits=28 is sufficient — TSan's LLVM re-exec handles the rare
  # case where a library lands in the shadow region by re-running the process
  # via personality(ADDR_NO_RANDOMIZE).
  # Do NOT set kernel.randomize_va_space=0: with ASLR fully off, ld-linux-aarch64.so
  # loads at its fixed default address (0x002000000000) which is exactly TSan's
  # 39-bit shadow start — guaranteed conflict every time.
  tags: [ "docker-in-docker:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Tsan
    SANITIZER_LC: tsan
    GTEST_ARCH: aarch64
    # Death tests fork; under TSan the child re-runs the interceptor init,
    # so the default "fast" style deadlocks. Inherited by every binary the
    # runner script executes.
    GTEST_DEATH_TEST_STYLE: threadsafe
  script:
    - ./gradlew :ddprof-lib:buildGtest${SANITIZER_CONFIG} --no-daemon --parallel --build-cache
    - sysctl -w vm.mmap_rnd_bits=28 2>/dev/null || true
    - .gitlab/scripts/run-gtest-quarantine.sh
