# C++ unit tests under ASan, TSan, and release optimisation.
#
# These run on every branch push (not MR pipelines — GitHub Actions handles those).
#
# The release configuration is here rather than left to the label-gated Java
# matrix because it is the only one that compiles the gtests with optimisation.
# Both sanitizer presets pass -fno-optimize-sibling-calls and no -O, so any
# defect that only appears once the optimiser runs -- a fixture frame folded
# away by a tail call, say -- is invisible to every other job in the pipeline.
#
# Strategy: use Gradle only for compile+link (buildGtest{Config}), then run
# each binary directly from the shell. This bypasses Gradle's daemon I/O
# which swallows child process output when fd 1/2 are not the terminal.

.sanitizer_job:
  stage: sanitizer
  extends: .cache-config
  needs: []
  timeout: 30m
  variables:
    GRADLE_USER_HOME: .gradle
  rules:
    - if: '$JDK_VERSION != null || $DEBUG_LEVEL != null || $HASH != null || $DOWNSTREAM != null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  interruptible: true
  # No before_script override: the toolchain lives in the build image, so the
  # pipeline default (CANCELLED guard, maven proxy) applies here like anywhere
  # else.
  script:
    - ./gradlew :ddprof-lib:buildGtest${SANITIZER_CONFIG} --no-daemon --parallel --build-cache
    - |
      find ddprof-lib/build/bin/gtest -mindepth 2 -maxdepth 2 -type f -executable \
        | grep "/${SANITIZER_LC}_" \
        | sort \
        | while read binary; do
          echo ""
          echo "=== $(basename $binary) ==="
          "$binary"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "FAILED: $(basename $binary) exited $rc"
            exit $rc
          fi
        done
  artifacts:
    when: always
    paths:
      - ddprof-lib/build/bin/gtest/${SANITIZER_LC}*/
    expire_in: 1 day

gtest-asan-amd64:
  extends: .sanitizer_job
  tags: [ "arch:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Asan
    SANITIZER_LC: asan

gtest-tsan-amd64:
  extends: .sanitizer_job
  # docker-in-docker:amd64 = Kata Containers (kata-qemu micro VMs).
  # Kata maps host-guest communication structures at fixed high addresses
  # that land in TSan's shadow region regardless of LLVM version or sysctl.
  # TSan on amd64 requires a non-Kata runner (EC2 or bare metal).
  tags: [ "docker-in-docker:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Tsan
    SANITIZER_LC: tsan
  script:
    - ./gradlew :ddprof-lib:buildGtest${SANITIZER_CONFIG} --no-daemon --parallel --build-cache
    - |
      find ddprof-lib/build/bin/gtest -mindepth 2 -maxdepth 2 -type f -executable \
        | grep "/${SANITIZER_LC}_" | sort | while read binary; do
          echo "=== $(basename $binary) ==="
          GTEST_DEATH_TEST_STYLE=threadsafe "$binary"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "FAILED: $(basename $binary) exited $rc"
            exit $rc
          fi
        done

gtest-asan-arm64:
  extends: .sanitizer_job
  tags: [ "arch:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Asan
    SANITIZER_LC: asan

# Not a sanitizer, but it reuses .sanitizer_job unchanged: buildGtestRelease
# exists alongside the sanitizer variants and emits binaries under the same
# bin/gtest/<config>_<test>/ layout the runner loop already globs for. The
# SANITIZER_* variable names are a misnomer here and nothing more.
gtest-release-amd64:
  extends: .sanitizer_job
  tags: [ "arch:amd64" ]
  image: $BUILD_IMAGE_X64
  variables:
    SANITIZER_CONFIG: Release
    SANITIZER_LC: release

gtest-release-arm64:
  extends: .sanitizer_job
  tags: [ "arch:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Release
    SANITIZER_LC: release

gtest-tsan-arm64:
  extends: .sanitizer_job
  # docker-in-docker:arm64 = EC2 VM. sysctl works directly.
  # vm.mmap_rnd_bits=28 is sufficient — TSan's LLVM re-exec handles the rare
  # case where a library lands in the shadow region by re-running the process
  # via personality(ADDR_NO_RANDOMIZE).
  # Do NOT set kernel.randomize_va_space=0: with ASLR fully off, ld-linux-aarch64.so
  # loads at its fixed default address (0x002000000000) which is exactly TSan's
  # 39-bit shadow start — guaranteed conflict every time.
  tags: [ "docker-in-docker:arm64" ]
  image: $BUILD_IMAGE_ARM64
  variables:
    SANITIZER_CONFIG: Tsan
    SANITIZER_LC: tsan
  script:
    - ./gradlew :ddprof-lib:buildGtest${SANITIZER_CONFIG} --no-daemon --parallel --build-cache
    - |
      sysctl -w vm.mmap_rnd_bits=28 2>/dev/null || true
      find ddprof-lib/build/bin/gtest -mindepth 2 -maxdepth 2 -type f -executable \
        | grep "/${SANITIZER_LC}_" | sort | while read binary; do
          echo "=== $(basename $binary) ==="
          GTEST_DEATH_TEST_STYLE=threadsafe "$binary"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "FAILED: $(basename $binary) exited $rc"
            exit $rc
          fi
        done

# Manual diagnostics for the depot mirror routing introduced in #866.
#
# The strict GITLAB_CI routing leaves the two depot mirrors as the only
# plugin/dependency sources, so any fetch failure from a runner pool surfaces
# as an unexplained "Plugin ... was not found" build failure. This job reports,
# per runner pool: proxy env, reachability of both depot read APIs and their
# S3 redirect targets (direct and through the CI egress proxy), and reruns the
# build-logic plugin resolution with the CI-shared Gradle cache and with a
# fresh one (a poisoned cached miss reproduces the failure even after the
# mirror heals).
#
# Deliberately no `set -e`: every probe must run even if an earlier one fails.
# `./gradlew help` is enough to reproduce the failure — the kotlin-dsl plugin
# resolution happens while configuring build-logic, before any build task.
.depot-mirror-diag:
  stage: sanitizer
  extends: .cache-config
  needs: []
  timeout: 15m
  variables:
    GRADLE_USER_HOME: .gradle
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: manual
      allow_failure: true
  script:
    - set -u
    - |
      MARKER="https://depot-read-api-bzl.us1.ddbuild.io/plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/6.7.6/org.gradle.kotlin.kotlin-dsl.gradle.plugin-6.7.6.pom"
      CENTRAL="https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/org/jetbrains/kotlin/kotlin-stdlib/2.4.10/kotlin-stdlib-2.4.10.pom"
      PROXY="http://127.0.0.1:15002"
      echo "== proxy-related env =="
      env | grep -i proxy || echo "(none)"
      command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; } || echo "curl unavailable, skipping HTTP probes"
      if command -v curl >/dev/null; then
        echo "== depot read APIs, direct egress =="
        curl -sS  -o /dev/null -w "bzl marker (no-follow)        %{http_code}\n" "$MARKER" || true
        curl -sSL -o /dev/null -w "bzl marker (followed)         %{http_code} -> %{url_effective}\n" "$MARKER" || true
        curl -sSL -o /dev/null -w "magicmirror stdlib (followed) %{http_code}\n" "$CENTRAL" || true
        echo "== depot read APIs, via CI egress proxy $PROXY =="
        curl -sS  -x "$PROXY" -o /dev/null -w "bzl marker via proxy (no-follow) %{http_code}\n" "$MARKER" || true
        curl -sSL -x "$PROXY" -o /dev/null -w "bzl marker via proxy (followed)  %{http_code}\n" "$MARKER" || true
      fi
    - echo "== Gradle with CI-shared GRADLE_USER_HOME=$GRADLE_USER_HOME =="
    - ./gradlew help --no-daemon --info --stacktrace > diag-gradle-cached.log 2>&1; echo "exit=$?"; tail -80 diag-gradle-cached.log
    - echo "== Gradle with fresh GRADLE_USER_HOME (no cached metadata) =="
    - ./gradlew help --no-daemon --info --stacktrace -g /tmp/gradle-fresh > diag-gradle-fresh.log 2>&1; echo "exit=$?"; tail -80 diag-gradle-fresh.log
  artifacts:
    when: always
    paths:
      - diag-gradle-*.log
    expire_in: 3 days

depot-mirror-diag-amd64:
  extends: .depot-mirror-diag
  tags: [ "arch:amd64" ]
  image: $BUILD_IMAGE_X64

depot-mirror-diag-arm64:
  extends: .depot-mirror-diag
  tags: [ "arch:arm64" ]
  image: $BUILD_IMAGE_ARM64
