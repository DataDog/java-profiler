# Memory gate: speedlab (DataDog/apm-reliability/speedlab, docs/memory-gate.md)
# compares spring-petclinic's memory with this branch's java-profiler build against
# main's, and posts a warn-only verdict on the PR. Manual: play `memory-gate`.
# The candidate is the snapshot build deploy-artifact published and verified
# (MEMORY_GATE_CANDIDATE, its dotenv report), so a later push cannot change it.
memory-gate:
  stage: benchmarks
  needs:
    - job: deploy-artifact
      artifacts: true
  # Where deploy-artifact publishes nothing (no open PR, merge queue, release
  # branches) or the gate measures nothing (main against itself), as for the
  # benchmarks jobs in .gitlab/benchmarks/.gitlab-ci.yml.
  rules:
    - !reference [.skip-on-release, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$JDK_VERSION != null || $DEBUG_LEVEL != null || $HASH != null || $DOWNSTREAM != null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
      when: never
    - when: manual
      allow_failure: true
  # Only the variables below reach speedlab: its jobs read ours, and upstream
  # variables would override their own settings.
  inherit:
    variables: false
  variables:
    SPEEDLAB_TRIGGER: java-profiler-memory-gate
    PROFILER_CANDIDATE: $MEMORY_GATE_CANDIDATE
    PROFILER_BASELINE: branch:main
    UPSTREAM_PROJECT_NAME: java-profiler
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME
    UPSTREAM_COMMIT_SHA: $CI_COMMIT_SHA
  trigger:
    project: DataDog/apm-reliability/speedlab
    # speedlab's trigger rules are on this branch until DataDog/speedlab#109 merges.
    branch: rkennke/memory-gate-trigger
