// Set DEPOT_EXPECTED_URL independently of MAVEN_REPOSITORY_PROXY/-P to check
// the effective repositories in both the main build and its included build.
def expected = System.getenv('DEPOT_EXPECTED_URL')
assert expected : 'Set DEPOT_EXPECTED_URL before running this regression check'

def pluginExpected = System.getenv('DEPOT_EXPECTED_PLUGIN_URL') ?: expected

def verifyRepositories = { String scope, repositories, List expectedUrls ->
    def urls = repositories.collect { it.url.toString().replaceAll('/+$', '') }
    assert urls == expectedUrls.collect { it.replaceAll('/+$', '') }.unique() : "$scope permits unexpected repositories: $urls"
    println "Depot repository check passed: $scope"
}

gradle.settingsEvaluated { settings ->
    verifyRepositories("${settings.rootProject.name} plugins", settings.pluginManagement.repositories, [expected, pluginExpected])
    if (settings.rootProject.name == 'java-profiler') {
        verifyRepositories('project dependencies', settings.dependencyResolutionManagement.repositories, [expected])
    }
}

gradle.afterProject { project ->
    if (project.rootProject.name == 'build-logic' && project.name == 'conventions') {
        verifyRepositories('build-logic dependencies', project.repositories, [expected])
    }
}
