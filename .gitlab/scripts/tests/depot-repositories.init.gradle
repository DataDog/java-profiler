// Expectations are independent of GITLAB_CI and the proxy inputs being tested.
def mode = System.getenv('DEPOT_EXPECTED_MODE') ?: 'depot'
assert mode in ['depot', 'public', 'custom-proxy'] : "Unknown repository check mode: $mode"
def expected = System.getenv('DEPOT_EXPECTED_URL')
assert mode == 'public' || expected : 'Set DEPOT_EXPECTED_URL for proxy checks'
def pluginExpected = System.getenv('DEPOT_EXPECTED_PLUGIN_URL') ?: expected
def central = 'https://repo.maven.apache.org/maven2/'
def portal = 'https://plugins.gradle.org/m2/'
def pluginUrls = mode == 'public' ? [portal, central] :
    mode == 'custom-proxy' ? [expected, portal, central] : [expected, pluginExpected, portal]
def dependencyUrls = mode == 'public' ? [central, portal] :
    mode == 'custom-proxy' ? [expected, central, portal] : [expected]
def conventionUrls = mode == 'public' ? [portal, central] :
    mode == 'custom-proxy' ? [expected, portal, central] : [expected]

def verifyRepositories = { String scope, repositories, List expectedUrls ->
    def urls = repositories.collect { it.url.toString().replaceAll('/+$', '') }
    assert urls == expectedUrls.collect { it.replaceAll('/+$', '') }.unique() : "$scope permits unexpected repositories: $urls"
    println "Repository check passed ($mode): $scope"
}

gradle.settingsEvaluated { settings ->
    verifyRepositories("${settings.rootProject.name} plugins", settings.pluginManagement.repositories, pluginUrls)
    if (settings.rootProject.name == 'java-profiler') {
        verifyRepositories('project dependencies', settings.dependencyResolutionManagement.repositories, dependencyUrls)
    }
}

gradle.afterProject { project ->
    if (project.rootProject.name == 'build-logic' && project.name == 'conventions') {
        verifyRepositories('build-logic dependencies', project.repositories, conventionUrls)
    }
}
