name: Update Release Assets
run-name: Update assets for ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: "Release tag"
        required: true
  push:
    tags:
      - v_*.*.*

permissions:
  contents: write
  actions: read

# Two runs for the same tag (tag push + manual dispatch) race the asset
# uploads and the --latest flag; serialize them per tag.
concurrency:
  group: update-assets-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  update-assets-and-releaase:
    if: (startsWith(github.event.ref, 'refs/tags/v_') || inputs.release_tag != '') && !endsWith(github.event.ref, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - name: Setup System
        id: setup-system
        run: |
          sudo apt update && sudo apt install -y wget unzip
      - name: Download Assets
        id: download-assets
        timeout-minutes: 30
        run: |
          # ignore errors to allow reattempted downloads
          set +e
          TAG=${{ inputs.release_tag }}
          if [ -z "$TAG" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          VERSION=$(echo "${TAG}" | sed -e 's/v_//g')
          ASSET_URL="https://repo1.maven.org/maven2/com/datadoghq/ddprof/${VERSION}/ddprof-${VERSION}.jar"
          RESULT=1
          while [ $RESULT -ne 0 ]; do
            wget -q $ASSET_URL
            RESULT=$?
            if [ $RESULT -ne 0 ]; then
              echo "Artifact not available. Retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Prepare Assets
        id: prepare-assets
        run: |
          LIB_BASE_DIR="META-INF/native-libs"
          mkdir assets
          cp ddprof-${VERSION}.jar assets/ddprof.jar
          cp ddprof-${VERSION}.jar assets/ddprof-${VERSION}.jar
          unzip ddprof-${VERSION}.jar
          mv ${LIB_BASE_DIR}/linux-arm64/libjavaProfiler.so assets/libjavaProfiler_linux-arm64.so
          mv ${LIB_BASE_DIR}/linux-x64/libjavaProfiler.so assets/libjavaProfiler_linux-x64.so
          mv ${LIB_BASE_DIR}/linux-arm64-musl/libjavaProfiler.so assets/libjavaProfiler_linux-arm64-musl.so
          mv ${LIB_BASE_DIR}/linux-x64-musl/libjavaProfiler.so assets/libjavaProfiler_linux-x64-musl.so
      - name: Update release ${{ inputs.release_tag }}
        id: update-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v_${VERSION}"
          gh release upload "${TAG}" assets/ddprof*.jar assets/*.so --clobber
          gh release edit "${TAG}" --draft=false --latest

  bump-dd-trace-java:
    # Open the dd-trace-java dependency-bump PR once the release artifacts
    # are live on Maven Central and the GitHub release is published. Needs a
    # token with contents:write + pull_requests:write on DataDog/dd-trace-java.
    needs: update-assets-and-releaase
    if: ${{ needs.update-assets-and-releaase.result == 'success' }}
    # A tag-triggered run and a manual run for the same version can both
    # pass the open-PR lookup; serialized here, the later run observes the
    # opened PR instead of deleting its head branch on push rejection.
    concurrency:
      # Per release version: a queued bump for one version must not gate a
      # queued bump for another; runs for the same version serialize (see
      # above).
      group: dd-trace-java-bump-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open bump PR on dd-trace-java
        env:
          DDTRACE_GH_TOKEN: ${{ secrets.DDTRACE_GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${RELEASE_TAG#v_}"
          NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          set +e
          .github/scripts/bump-ddtrace.sh "$VERSION" "$NOTES_URL"
          RC=$?
          set -e
          # Exit 3 is the documented no-token skip, not a failure; the
          # release and assets are already published at this point.
          if [ "$RC" -eq 3 ]; then
            echo "::warning::dd-trace-java bump skipped: DDTRACE_GH_TOKEN is not configured"
            exit 0
          fi
          exit $RC
