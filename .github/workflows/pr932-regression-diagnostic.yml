name: PR932 native ELF TSan diagnostic

on:
  push:
    branches:
      - paul.fournillon/diagnose-pr932-regression

permissions:
  contents: read
  actions: read

jobs:
  paired-native-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 66f01812f2acfbe9d2f48aae80fad43cf924815e
      CANDIDATE_SHA: 152d939c395a37142202e407e2860efc4515ef04
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize paired results
        id: initialize
        shell: bash
        run: |
          mkdir -p diagnostic/base diagnostic/candidate
          printf '{"expected_sha":"%s","status":"not_attempted"}\n' "$BASE_SHA" > diagnostic/base/result.json
          printf '{"expected_sha":"%s","status":"not_attempted"}\n' "$CANDIDATE_SHA" > diagnostic/candidate/result.json
          {
            printf 'pair_host=same job, sequential sources\nrunner=%s\nimage=%s\nimage_version=%s\n' "$RUNNER_NAME" "$ImageOS" "$ImageVersion"
            uname -a || printf 'uname: unavailable/unverified\n'
            cat /etc/os-release || printf '/etc/os-release: unavailable/unverified\n'
            for path in /proc/sys/kernel/randomize_va_space /proc/sys/vm/mmap_rnd_bits; do
              grep -H . "$path" || printf '%s: unavailable/unverified\n' "$path"
            done
            grep -E '^(Seccomp|Seccomp_filters|NoNewPrivs):' /proc/self/status || printf '/proc/self/status: unavailable/unverified\n'
          } > diagnostic/host.txt
      - name: Download immutable producer artifact
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/DataDog/java-profiler/actions/artifacts/13965627960 > diagnostic/producer-metadata.json
          gh api repos/DataDog/java-profiler/actions/artifacts/13965627960/zip > diagnostic/producer.zip
      - name: Setup ordinary glibc debug dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdb
          sudo apt-get install -y libc6-dbg
      - name: Record current replay runtime
        shell: bash
        run: |
          exec > diagnostic/replay-runtime.txt 2>&1
          printf 'observation=current replay runtime after dependency setup; producer metadata is separate\n'
          for package in libc6 libc6-dbg libstdc++6 libgcc-s1; do
            dpkg-query -W -f='${binary:Package}=${Version} architecture=${Architecture} source=${source:Package} source-version=${source:Version}\n' "$package" || printf 'package %s: unavailable/unverified\n' "$package"
          done
          ldd --version || printf 'ldd version: unavailable/unverified\n'
          readelf -n /lib64/ld-linux-x86-64.so.2 || printf 'loader notes/build ID: unavailable/unverified\n'
          sha256sum /lib64/ld-linux-x86-64.so.2 || printf 'loader SHA256: unavailable/unverified\n'
      - name: Replay retained ELF suites in fixed counterbalanced order
        shell: bash
        run: |
          python3 .github/scripts/pr932_elf_replay.py diagnostic/producer.zip diagnostic/producer-metadata.json diagnostic/replay
      - name: Retain paired diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr932-native-elf-tsan-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 14
